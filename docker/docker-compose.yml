services:
  postgres:
    image: postgres:16-alpine
    container_name: dxp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-workforce_navigator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dxp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxp} -d ${POSTGRES_DB:-workforce_navigator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dxp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dxp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dxp_pg_data:
  dxp_redis_data:
